[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes-backend"
version = "0.1.0"
description = "MeetNotes real-time AI meeting intelligence backend and ARQ worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "watchfiles>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "arq>=0.26.1",
    "redis>=5.2.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "websockets>=13.1",
    "deepgram-sdk>=3.7.0",
    "google-genai>=1.0.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live_ai: opt-in end-to-end tests hitting live Deepgram and Gemini APIs",
]
